<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <nav>
            <ul class="nav-list">
                <a href="{{ url_for('views.admin_dashboard') }}" class="logo">
                    <img src="static/images/logo.png" alt="Logo" class="logo-img">
                </a>
                <li><a href="{{ url_for('views.admin_approval') }}">Schvalování</a></li>
                <li><a href="{{ url_for('views.admin_statistics') }}" class="active">Statistiky</a></li>
                <li><a href="{{ url_for('views.admin_manage') }}">Správa</a></li>
                <li><a href="{{ url_for('auth.logout') }}">Odhlásit se</a></li>
            </ul>
        </nav>
    </header>



    <main>
        <section class="login-section">
            <div id="login-form">
                <form method="POST" >
                    <h1>Přihlášení</h1>
                    <div class="form">
                        <label for="email">Email</label><br>
                        <input 
                            type="email" 
                            class="inputfield" 
                            id="email" 
                            name="email" 
                            placeholder="Enter email">
                    </div>
                    <div class="form">
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            class="inputfield" 
                            id="password" 
                            name="password" 
                            placeholder="Enter password">
                    </div>
                    <br />
                    <button type="submit" class="login-button">Přihlásit</button>
                </form>
               
            </div>
        </section>
    </main>


    <footer>
        <div class="footer-content">
            <img src="static/images/logo.png" alt="Logo" class="footer-logo">
            <p>&copy; 2024 Restaurace</p>
        </div>
    </footer>
</body>

</html>

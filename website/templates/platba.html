<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platba</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script>
        // Dynamické zobrazení/skrytí platebních polí na základě výběru způsobu platby
        function togglePaymentFields() {
            const paymentMethod = document.getElementById('payment-method').value;
            const cardFields = document.getElementById('card-fields');
            if (paymentMethod === 'Karta') {
                cardFields.style.display = 'block';
            } else {
                cardFields.style.display = 'none';
            }
        }
    </script>
</head>
<body>
    <header>
        <nav>
            <ul class="nav-list">
                <a href="{{ url_for('views.index') }}" class="logo">
                    <img src="static/images/logo.png" alt="Logo" class="logo-img">
                </a>
                <li><a href="{{ url_for('views.index') }}">O nás</a></li>
                <li><a href="{{ url_for('views.nabidka') }}">Nabídka</a></li>
                <li><a href="{{ url_for('views.objednat') }}">Objednat</a></li>
                <li><a href="{{ url_for('views.historie') }}">Historie</a></li>
                <li><a href="{{ url_for('views.cart') }}">Košík</a></li>
                <img src="static/images/profile.png" alt="User" class="user-button-img" onclick="toggleMenu()">
            </ul>
        </nav>
    </header>
    <main>
        <section class="payment-section">
            <h1>Platba</h1>
            <p>Vyplňte prosím své platební údaje pro dokončení objednávky.</p>
<form id="payment-form" method="POST" action="/create-order">
    <label for="address">Adresa doručení:</label>
    <input type="text" id="address" name="address" required>

    <label for="payment-method">Způsob platby:</label>
    <select id="payment-method" name="payment_method" required>
        <option value="Dobírka">Dobírka</option>
        <option value="Karta">Karta</option>
    </select>

    <label for="restaurant-select">Vyberte restauraci:</label>
    <select id="restaurant-select" name="restaurant_id" required>
        {% for restaurace in restaurants %}
            <option value="{{ restaurace.id }}">{{ restaurace.nazev }}</option>
        {% endfor %}
    </select>

    <button type="submit" class="btn btn-success">Dokončit platbu</button>
</form>


        </section>
    </main>
    <footer>
        <div class="footer-content">
            <p>&copy; 2024 Restaurace</p>
        </div>
    </footer>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>

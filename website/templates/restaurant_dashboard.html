<h1>Restaurant Dashboard</h1>
<a href="{{ url_for('views.add_menu_item') }}">Add Menu Item</a>

{% for item in menu_items %}
<div>
    <h3>{{ item.name }}</h3>
    <p>{{ item.description }}</p>
    <p>{{ item.price }} Kč</p>
    <p>{{ item.category }}</p>
    <form method="POST" action="{{ url_for('views.delete_menu_item', item_id=item.id) }}">
        <button type="submit">Delete</button>
    </form>
</div>
{% endfor %}
